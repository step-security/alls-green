---
name: alls-green
description: >-
  GitHub Action for checking that the test matrix jobs are all
  successful before proceeding. To be used in branch protection
author: >-
  step-security

branding:
  icon: check-circle
  color: green

inputs:
  jobs:
    description: >-
      A list of jobs from the `needs` context, serialized as a JSON
      string via `toJSON(needs)`
    required: true
  allowed-failures:
    default: >-
      []
    description: >-
      Job names that are allowed to fail and not affect the outcome,
      as a comma-separated list or serialized as a JSON string
    required: false
  allowed-skips:
    default: >-
      []
    description: >-
      Job names that are allowed to be skipped and not affect the
      outcome, as a comma-separated list or serialized as a JSON string
    required: false

outputs:
  failure:
    description: Whether this check decided that the job matrix failed.
    value: ${{ steps.outcome.outputs.failure }}
  result:
    description: Failure or success result of the job matrix.
    value: ${{ steps.outcome.outputs.result }}
  success:
    description: Whether this check decided that the job matrix succeeded.
    value: ${{ steps.outcome.outputs.success }}

runs:
  using: composite
  steps:
  - name: Subscription check
    env:
      REPO_PRIVATE: ${{ github.event.repository.private }}
    run: |
      UPSTREAM="re-actors/alls-green"
      ACTION_REPO="${GITHUB_ACTION_REPOSITORY:-}"
      DOCS_URL="https://docs.stepsecurity.io/actions/stepsecurity-maintained-actions"

      echo ""
      echo -e "\033[1;36mStepSecurity Maintained Action\033[0m"
      echo "Secure drop-in replacement for $UPSTREAM"
      if [ "$REPO_PRIVATE" = "false" ]; then
        echo -e "\033[32m✓ Free for public repositories\033[0m"
      fi
      echo -e "\033[36mLearn more:\033[0m $DOCS_URL"
      echo ""

      if [ "$REPO_PRIVATE" != "false" ]; then
        SERVER_URL="${GITHUB_SERVER_URL:-https://github.com}"

        if [ "$SERVER_URL" != "https://github.com" ]; then
          BODY=$(printf '{"action":"%s","ghes_server":"%s"}' "$ACTION_REPO" "$SERVER_URL")
        else
          BODY=$(printf '{"action":"%s"}' "$ACTION_REPO")
        fi

        API_URL="https://agent.api.stepsecurity.io/v1/github/$GITHUB_REPOSITORY/actions/maintained-actions-subscription"

        RESPONSE=$(curl --max-time 3 -s -w "%{http_code}" \
          -X POST \
          -H "Content-Type: application/json" \
          -d "$BODY" \
          "$API_URL" -o /dev/null) && CURL_EXIT_CODE=0 || CURL_EXIT_CODE=$?

        if [ $CURL_EXIT_CODE -ne 0 ]; then
          echo "Timeout or API not reachable. Continuing to next step."
        elif [ "$RESPONSE" = "403" ]; then
          echo -e "::error::\033[1;31mThis action requires a StepSecurity subscription for private repositories.\033[0m"
          echo -e "::error::\033[31mLearn how to enable a subscription: $DOCS_URL\033[0m"
          exit 1
        fi
      fi
    shell: bash

  - name: Decide whether the input jobs succeeded or failed
    id: outcome
    env:
      PYTHONPATH: ${{ github.action_path }}/src
    run: |
      python -m normalize_needed_jobs_status \
      "$(cat << EOM
        ${{ inputs.allowed-failures }}
      EOM
      )" \
      "$(cat << EOM
        ${{ inputs.allowed-skips }}
      EOM
      )" \
      "$(cat << EOM
        ${{ inputs.jobs }}
      EOM
      )"
    shell: bash
...
